[package]
name = "tiktok"
version = "0.2.0"
edition = "2021"
description = "TikTok on Pointman: send videos to a TikTok account as inbox drafts or direct posts, through TikTok's Content Posting API."
license = "MIT"
repository = "https://github.com/jamescalam/pointman-tiktok"
publish = false

[dependencies]
anyhow = "1"
# buffa's code for proto/tiktok/v1/tiktok.proto (build.rs) uses these: keep them at the SDK's versions
buffa = { version = "0.9.2", features = ["json"] }
getrandom = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
url = "2"

[build-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.0", features = ["proto"] }

[dev-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.0", features = ["proto"] }
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
